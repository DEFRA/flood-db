services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    ports:
      - "8080:80"  # Map port 8080 on host to port 80 inside container
    environment:
      - PGADMIN_DEFAULT_EMAIL=ubuntu@localhost.localdomain
      - PGADMIN_DEFAULT_PASSWORD=secret
    volumes:
      - ~/.config/pgadmin4:/var/lib/pgadmin  # Mount a local directory to persist pgAdmin data
